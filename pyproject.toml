[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-recon-agent"
version = "0.10.2"
description = "A small, Claude-orchestrated recon/study agent for authorized targets only."
requires-python = ">=3.10"
# requirements.txt stays the single list of runtime dependencies (house style);
# the package reads it rather than repeating it.
dynamic = ["dependencies"]

[project.scripts]
ai-recon = "agent:main"
ai-hunt = "hunt:main"
ai-purple = "purple:main"

[tool.setuptools]
# Flat layout: every top-level module is listed, and tests/test_v0100.py fails
# if one is added to the repository and left out of this list.
py-modules = [
    "agent", "apiclient", "caching", "completeness", "console", "detections", "envelope",
    "hunt", "knowledge", "logtime", "parsers", "paths", "purple", "repeats",
    "report", "safety", "state", "surface", "telemetry", "version", "wordgen",
]
packages = ["tools"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin an explicit, stable ruleset so `ruff check .` behaves the same across
# ruff versions (its defaults and preview rules drift between releases).
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter, not worth failing CI over
]

[tool.ruff.lint.per-file-ignores]
# These modules intentionally manipulate sys.path before importing local
# modules so the tool works whether run as a script or a package.
"tools/recon.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
